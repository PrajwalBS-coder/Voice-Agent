media:
  videos: {}
  pictures_dir: "pictures"
apps: {}
llm:
  provider: "auto"
  model: "gemini-3.8-flash"
  # Leave empty for automatic GEMINI_API_KEY / OPENAI_API_KEY selection.
  api_key_env: ""
coding:
  model: "qwen2.5-coder:7b"
voice:
  stt_model: "base.en"
  stt_language: "en"
  stt_beam_size: 5
  # Recording already detects speech; keeping this false avoids dropping short words twice.
  stt_vad_filter: false
  tts_enabled: true
  startup_greeting: true
  tts_voice: "Charon"
  tts_rate: 155
  tts_volume: 1.0
  default_emotion: "calm"
database:
  url: "sqlite:///data/jarvis-memory.db"
memory:
  enabled: true
  recent_turns: 6
audio:
  input_dir: "audio/input"
  output_dir: "audio/output"
  vad_enabled: false
  vad_threshold: 0.5
  silence_seconds: 1.5
  threshold: 0.008
  pre_roll_seconds: 0.5
  min_speech_seconds: 0.25
