media:
  videos: {}
  pictures_dir: "pictures"
apps: {}
llm:
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
coding:
  model: "qwen2.5-coder:7b"
voice:
  stt_model: "base.en"
  tts_enabled: true
  tts_voice: "Hazel"
  tts_rate: 155
  tts_volume: 1.0
  default_emotion: "calm"
database:
  url: "sqlite:///data/jarvis-memory.db"
memory:
  enabled: true
  recent_turns: 6
audio:
  input_dir: "audio/input"
  output_dir: "audio/output"
  vad_enabled: false
  vad_threshold: 0.5
  silence_seconds: 1.2
  threshold: 0.015
  pre_roll_seconds: 0.3
