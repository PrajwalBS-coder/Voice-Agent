media:
  videos:
    inception: "C:/Users/you/Videos/inception.mp4"
  pictures_dir: "pictures"
apps:
  browser: "https://www.google.com"
  notepad: "notepad.exe"
llm:
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
coding:
  model: "qwen2.5-coder:7b"
database:
  # SQLite works locally with no separate server. PostgreSQL URLs are also supported.
  url: "sqlite:///data/jarvis-memory.db"
memory:
  # Recent turns are supplied to the configured LLM for context-aware replies.
  enabled: true
  recent_turns: 6
voice:
  stt_model: "base.en"
  tts_enabled: false
  tts_voice: "David"
  tts_rate: 155
  tts_volume: 1.0
  default_emotion: "calm"
audio:
  input_dir: "audio/input"
  output_dir: "audio/output"
  # Enable local Silero VAD for more reliable end-of-speech detection.
  vad_enabled: false
  vad_threshold: 0.5
  silence_seconds: 1.2
  # Used only when VAD is disabled.
  threshold: 0.015
  pre_roll_seconds: 0.3
